services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: siyue_blog
      POSTGRES_USER: siyue
      POSTGRES_PASSWORD: siyue_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siyue -d siyue_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIYUE_APP_ENV: development
      SIYUE_POSTGRES_HOST: postgres
      SIYUE_POSTGRES_PORT: 5432
      SIYUE_POSTGRES_USER: siyue
      SIYUE_POSTGRES_PASSWORD: siyue_dev
      SIYUE_POSTGRES_DBNAME: siyue_blog
      SIYUE_JWT_ACCESS_SECRET: local-compose-access-secret-change-before-sharing
      SIYUE_JWT_REFRESH_SECRET: local-compose-refresh-secret-change-before-sharing
      SIYUE_ADMIN_USERNAME: admin
      SIYUE_ADMIN_EMAIL: admin@example.local
      SIYUE_ADMIN_PASSWORD: local-admin-password-change-me
      SIYUE_CORS_ALLOW_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_AUTHOR_NAME: ${AUTHOR_NAME:-SiYue}
        NEXT_PUBLIC_AUTHOR_EMAIL: ${AUTHOR_EMAIL:-contact@siyue.dev}
        NEXT_PUBLIC_AUTHOR_GITHUB: ${AUTHOR_GITHUB:-https://github.com/SiYue-ZO}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_URL: http://backend:8080
      API_INTERNAL_URL: http://backend:8080/api/v1
      API_INTERNAL_ADMIN_URL: http://backend:8080/api/admin
      SITE_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_v18:
