name: Publish and Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.DOMAIN != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.names.outputs.owner }}
      release: ${{ steps.names.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "release=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/siyue-blog-backend:${{ steps.names.outputs.release }}
            ghcr.io/${{ steps.names.outputs.owner }}/siyue-blog-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/siyue-blog-frontend:${{ steps.names.outputs.release }}
            ghcr.io/${{ steps.names.outputs.owner }}/siyue-blog-frontend:latest
          build-args: |
            API_PROXY_URL=http://backend:8080
            NEXT_PUBLIC_SITE_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.SITE_NAME }}
            NEXT_PUBLIC_SITE_DESCRIPTION=${{ vars.SITE_DESCRIPTION }}
            NEXT_PUBLIC_AUTHOR_NAME=${{ vars.AUTHOR_NAME }}
            NEXT_PUBLIC_AUTHOR_BIO=${{ vars.AUTHOR_BIO }}
            NEXT_PUBLIC_AUTHOR_EMAIL=${{ vars.AUTHOR_EMAIL }}
            NEXT_PUBLIC_AUTHOR_LOCATION=${{ vars.AUTHOR_LOCATION }}
            NEXT_PUBLIC_AUTHOR_GITHUB=${{ vars.AUTHOR_GITHUB }}
            NEXT_PUBLIC_AUTHOR_TWITTER=${{ vars.AUTHOR_TWITTER }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: publish
    if: vars.ENABLE_SSH_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.release }}
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare release files and registry access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -eu
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be a safe absolute Linux path" >&2
            exit 1
          fi
          if [ -z "$DEPLOY_ENV" ]; then
            echo "DEPLOY_ENV secret is required" >&2
            exit 1
          fi
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$remote" "install -d -m 700 '$DEPLOY_PATH' '$DEPLOY_PATH/caddy' '$DEPLOY_PATH/scripts'"
          scp docker-compose.prod.yml "$remote:$DEPLOY_PATH/docker-compose.prod.yml"
          scp caddy/Caddyfile "$remote:$DEPLOY_PATH/caddy/Caddyfile"
          scp scripts/backup.sh "$remote:$DEPLOY_PATH/scripts/backup.sh"
          printf '%s\n' "$DEPLOY_ENV" | ssh "$remote" "umask 077 && cat > '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env'"
          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | ssh "$remote" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          fi
      - name: Roll out immutable release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DOMAIN: ${{ vars.DOMAIN }}
          OWNER: ${{ needs.publish.outputs.owner }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml config --quiet && BACKEND_IMAGE='ghcr.io/$OWNER/siyue-blog-backend' FRONTEND_IMAGE='ghcr.io/$OWNER/siyue-blog-frontend' RELEASE_TAG='$RELEASE' docker compose -f docker-compose.prod.yml pull backend frontend && BACKEND_IMAGE='ghcr.io/$OWNER/siyue-blog-backend' FRONTEND_IMAGE='ghcr.io/$OWNER/siyue-blog-frontend' RELEASE_TAG='$RELEASE' docker compose -f docker-compose.prod.yml up -d --remove-orphans"
          curl --fail --retry 12 --retry-delay 5 "https://$DOMAIN/api/v1/health"
