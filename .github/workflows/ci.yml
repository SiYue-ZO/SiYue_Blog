name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: siyue_test
          POSTGRES_USER: siyue_test
          POSTGRES_PASSWORD: local-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siyue_test -d siyue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIYUE_TEST_POSTGRES_DSN: postgres://siyue_test:local-ci-test-password@127.0.0.1:5432/siyue_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DOMAIN: blog.example.com
      DB_PASSWORD: ci-database-password-not-used-in-production
      JWT_ACCESS_SECRET: ci-access-secret-with-more-than-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-more-than-thirty-two-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password-not-used
      AUTHOR_EMAIL: author@example.com
      AUTHOR_GITHUB: https://github.com/example
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: siyue-blog-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: siyue-blog-frontend:ci
          build-args: |
            API_PROXY_URL=http://backend:8080
            NEXT_PUBLIC_SITE_URL=https://blog.example.com
            NEXT_PUBLIC_AUTHOR_EMAIL=author@example.com
            NEXT_PUBLIC_AUTHOR_GITHUB=https://github.com/example
