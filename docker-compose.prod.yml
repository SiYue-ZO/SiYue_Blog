services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-siyue_blog}
      POSTGRES_USER: ${DB_USER:-siyue}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siyue} -d ${DB_NAME:-siyue_blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GIN_MODE=release
      - SIYUE_APP_ENV=production
      - SIYUE_POSTGRES_HOST=postgres
      - SIYUE_POSTGRES_PORT=5432
      - SIYUE_POSTGRES_USER=${DB_USER:-siyue}
      - SIYUE_POSTGRES_PASSWORD=${DB_PASSWORD}
      - SIYUE_POSTGRES_DBNAME=${DB_NAME:-siyue_blog}
      - SIYUE_JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - SIYUE_JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
