app:
  name: siyue-blog
  version: 1.0.0
  env: development

http:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  max_body_bytes: 2097152

postgres:
  host: localhost
  port: 5432
  user: siyue
  password: siyue_dev
  dbname: siyue_blog
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  max_lifetime: 300s

jwt:
  access_secret: local-development-access-secret-change-me
  refresh_secret: local-development-refresh-secret-change-me
  access_ttl: 15m
  refresh_ttl: 168h

auth:
  allow_registration: false
  cookie_domain: ""
  cookie_secure: false

admin:
  username: admin
  email: admin@example.local
  password: local-admin-password-change-me

cors:
  allow_origins:
    - http://localhost:3000
    - http://localhost:3001

log:
  level: debug
  format: console
